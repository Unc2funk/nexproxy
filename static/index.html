<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexProxy</title>
  
  <link rel="stylesheet" href="/index.css">

  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
</head>
<body>

  <!-- BACKGROUND WAVES -->
  <div class="ocean">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <!-- LEFT REVIEWS -->
  <div class="reviews-container reviews-left">
    <div class="reviews-track" id="left-reviews">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- RIGHT REVIEWS -->
  <div class="reviews-container reviews-right">
    <div class="reviews-track" id="right-reviews">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- SIDE TAB (SETTINGS) -->
  <div class="side-tab">
    <div class="tab-handle">
      <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
    </div>
    
    <div class="tab-section">
      <h3>Theme Color</h3>
      <div class="color-picker">
        <div class="color-swatch" style="background: #3b82f6" onclick="setTheme('#3b82f6')"></div>
        <div class="color-swatch" style="background: #ef4444" onclick="setTheme('#ef4444')"></div>
        <div class="color-swatch" style="background: #10b981" onclick="setTheme('#10b981')"></div>
        <div class="color-swatch" style="background: #a855f7" onclick="setTheme('#a855f7')"></div>
        <div class="color-swatch" style="background: #f59e0b" onclick="setTheme('#f59e0b')"></div>
      </div>
    </div>

    <div class="tab-section">
      <h3>Search Engine</h3>
      <select class="select-box" id="engine-select">
        <option value="https://www.google.com/search?q=%s">Google</option>
        <option value="https://www.bing.com/search?q=%s">Bing</option>
        <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
      </select>
    </div>

    <div class="tab-section">
      <h3>Cloak URL (Tab Name)</h3>
      <input type="text" class="input-box" id="cloak-title" placeholder="e.g. Google Docs" onchange="setCloak()">
    </div>

    <div class="tab-section">
      <h3>Panic Key</h3>
      <p style="font-size: 0.8rem; margin-bottom: 5px; color: #ccc;">Press key to set, press to escape</p>
      <div class="panic-key-display" id="panic-btn">`</div>
    </div>

    <div class="tab-section">
      <h3>Bookmarks</h3>
      <div class="bookmarks">
        <div class="bookmark" onclick="goURL('https://youtube.com')">YouTube</div>
        <div class="bookmark" onclick="goURL('https://discord.com')">Discord</div>
        <div class="bookmark" onclick="goURL('https://reddit.com')">Reddit</div>
        <div class="bookmark" onclick="goURL('https://nowgg.nl')">Now.gg</div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="container" id="main-container">
    <div class="logo" id="logo">NexProxy</div>
    
    <form id="search-form" class="search-box">
      <input type="text" id="url-input" class="search-input" placeholder="Search the web or enter URL..." autocomplete="off">
      <button type="submit" id="go-btn" class="search-btn">Go</button>
    </form>
    
    <div id="status">Checking systems...</div>
    
    <iframe id="iframe-container"></iframe>
  </div>

  <script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("url-input");
    const iframe = document.getElementById("iframe-container");
    const container = document.getElementById("main-container");
    const status = document.getElementById("status");

    function setStatus(msg, type = "info") {
      status.textContent = msg;
      status.style.color = type === "error" ? "#ef4444" : type === "ready" ? "#10b981" : "rgba(255,255,255,0.6)";
    }

    // Force hard reset via ?reset=true
    if (window.location.search.includes("reset=true")) {
      setStatus("Resetting proxy...", "info");
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (let r of registrations) r.unregister();
        window.location.href = "/";
      });
    }

    async function boot() {
      try {
        await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        setStatus("✓ Proxy ready — Press / to focus search", "ready");
      } catch (err) {
        console.error(err);
        setStatus("❌ Failed to register proxy. Click here to reset.", "error");
        status.style.cursor = "pointer";
        status.onclick = () => window.location.href = "/?reset=true";
      }
    }

    boot();

    function goURL(value) {
      if (!value.trim()) return;
      
      const engine = document.getElementById('engine-select').value;
      
      // Determine if it's a URL or search query
      let url = value.trim();
      if (!/^http(s?):\/\//.test(url) && !url.includes(".") || url.includes(" ")) {
        url = engine.replace("%s", encodeURIComponent(url));
      } else if (!/^http(s?):\/\//.test(url)) {
        url = "https://" + url;
      }

      container.classList.add("proxy-active");
      iframe.src = __uv$config.prefix + __uv$config.encodeUrl(url);
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      goURL(input.value);
    });

    // Press / to focus search
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
      }
    });

    // ═══════════════════════════════════════════════
    // UI FEATURES
    // ═══════════════════════════════════════════════
    
    // Theme logic
    function setTheme(color) {
      document.documentElement.style.setProperty('--accent-color', color);
      // convert hex to rgba for glow
      let r = parseInt(color.slice(1,3), 16);
      let g = parseInt(color.slice(3,5), 16);
      let b = parseInt(color.slice(5,7), 16);
      document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.5)`);
      localStorage.setItem('nexproxy-theme', color);
    }
    const savedTheme = localStorage.getItem('nexproxy-theme');
    if (savedTheme) setTheme(savedTheme);

    // Cloaking
    function setCloak() {
      const title = document.getElementById('cloak-title').value;
      if (title) {
        document.title = title;
        localStorage.setItem('nexproxy-cloak', title);
        
        // Change favicon
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
        }
        // Use a generic google docs icon or search for it based on the name
        // The easiest is to use google's s2 to get a favicon for a related domain, or just default to google docs
        const domains = {
          "Google Docs": "docs.google.com",
          "Google Drive": "drive.google.com",
          "Canvas": "canvas.instructure.com",
          "Schoology": "schoology.com",
          "Desmos": "desmos.com"
        };
        const domain = domains[title] || "google.com";
        link.href = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

      } else {
        document.title = 'NexProxy';
        localStorage.removeItem('nexproxy-cloak');
        let link = document.querySelector("link[rel~='icon']");
        if (link) link.href = "/favicon.ico"; // Reset
      }
    }
    const savedCloak = localStorage.getItem('nexproxy-cloak');
    if (savedCloak) {
      document.getElementById('cloak-title').value = savedCloak;
      setCloak();
    }

    // Panic Key
    let panicKey = localStorage.getItem('nexproxy-panic') || '`';
    const panicBtn = document.getElementById('panic-btn');
    panicBtn.textContent = panicKey;
    
    let isListeningForKey = false;
    panicBtn.addEventListener('click', () => {
      isListeningForKey = true;
      panicBtn.textContent = "Press any key...";
    });

    document.addEventListener('keydown', (e) => {
      if (isListeningForKey) {
        e.preventDefault();
        panicKey = e.key;
        localStorage.setItem('nexproxy-panic', panicKey);
        panicBtn.textContent = panicKey;
        isListeningForKey = false;
        return;
      }

      if (e.key === panicKey && document.activeElement !== input && document.activeElement.tagName !== 'INPUT') {
        window.location.href = "https://classroom.google.com";
      }
    });

    // Reviews Generator
    const leftReviews = [
      { author: "tung", text: "w website" },
      { author: "anonymous", text: "best proxy hands down" },
      { author: "student", text: "literally saved my life during study hall" }
    ];
    const rightReviews = [
      { author: "unc", text: "such a hemmy website, why no proxypal support." },
      { author: "gamer", text: "unblocked roblox 10/10" },
      { author: "dev", text: "clean UI, smooth speeds" }
    ];

    function createReviews(containerId, reviewsList) {
      const track = document.getElementById(containerId);
      // Clone them a few times to make the scroll seamless
      for (let i = 0; i < 3; i++) {
        reviewsList.forEach(r => {
          const card = document.createElement('div');
          card.className = 'review-card';
          card.innerHTML = `<span class="review-author">${r.author}:</span> ${r.text}`;
          track.appendChild(card);
        });
      }
    }
    
    createReviews('left-reviews', leftReviews);
    createReviews('right-reviews', rightReviews);

  </script>
</body>
</html>
